<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCASP Score Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#15264c;--blue:#3ca5d5;--blue-light:#b8e4f2;--blue-pale:#e8f6fb;--gray:#707070;--danger:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:#f0f4f8;color:var(--navy);min-height:100vh;}
header{background:var(--navy);color:white;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:66px;box-shadow:0 2px 12px rgba(21,38,76,.2);}
.hbrand{display:flex;align-items:center;gap:0;}
.hlogo{height:48px;width:auto;object-fit:contain;display:block;}
.hdiv{width:1px;height:34px;background:rgba(184,228,242,.3);margin:0 16px;}
.htxt h1{font-family:"Crete Round",serif;font-size:18px;color:white;}
.htxt p{font-size:11px;color:var(--blue-light);margin-top:2px;}
.hacts{display:flex;gap:8px;align-items:center;}
.btn{padding:8px 15px;border-radius:6px;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:all .15s;}
.btn-o{background:transparent;border:1.5px solid rgba(184,228,242,.4);color:var(--blue-light);}
.btn-o:hover{background:rgba(184,228,242,.1);}
.btn-p{background:var(--blue);color:white;}
.btn-p:hover{background:#2e8fb8;}
.app-body{display:grid;grid-template-columns:370px 1fr;min-height:calc(100vh - 66px);}
.sidebar{background:white;border-right:1px solid #dde3ec;display:flex;flex-direction:column;overflow-y:auto;max-height:calc(100vh - 66px);}
.ss{padding:16px 20px;border-bottom:1px solid #edf0f5;}
.ss h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:11px;}
.slist{display:flex;flex-direction:column;gap:8px;}
.srow{display:grid;grid-template-columns:1fr 80px 70px 26px;gap:5px;align-items:center;}
.srow input,.srow select{font-family:"DM Sans",sans-serif;font-size:12px;border:1.5px solid #dde3ec;border-radius:6px;padding:6px 7px;color:var(--navy);background:white;width:100%;}
.srow input:focus,.srow select:focus{outline:none;border-color:var(--blue);}
.srow input[type=number]{text-align:center;}
.lwrap{display:flex;align-items:center;gap:6px;}
.lwrap input{flex:1;min-width:0;}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.rbtn{width:26px;height:26px;border:none;background:none;color:#bbb;cursor:pointer;border-radius:4px;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0;transition:all .15s;line-height:1;}
.rbtn:hover{color:var(--danger);background:#fff0f0;}
.abtn{margin-top:9px;width:100%;padding:8px;background:var(--blue-pale);border:1.5px dashed var(--blue);border-radius:6px;color:var(--blue);font-family:"DM Sans",sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;}
.abtn:hover{background:var(--blue-light);}
.abtn:disabled{opacity:.4;cursor:not-allowed;}
.rgrid{display:grid;grid-template-columns:1fr 58px 58px;gap:5px;}
.rgrid .rgh{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);}
.rgrid input{font-family:"DM Sans",sans-serif;font-size:11px;border:1.5px solid #dde3ec;border-radius:5px;padding:5px 5px;text-align:center;color:var(--navy);width:100%;}
.rgrid input:focus{outline:none;border-color:var(--blue);}
.rlname{display:flex;align-items:center;gap:5px;}
.rlname input{font-size:11px;border:1.5px solid #dde3ec;border-radius:5px;padding:5px 6px;color:var(--navy);width:100%;}
.rswatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.chart-area{padding:18px;background:#f0f4f8;display:flex;flex-direction:column;}
.chart-card{background:white;border-radius:12px;border:1px solid #dde3ec;padding:22px 26px 16px;flex:1;display:flex;flex-direction:column;}
.cch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.cch h2{font-family:"Crete Round",serif;font-size:16px;color:var(--navy);}
.cch p{font-size:11px;color:var(--gray);margin-top:2px;}
svg#curve{width:100%;flex:1;min-height:300px;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid #edf0f5;}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--navy);}
.tooltip{position:fixed;background:var(--navy);color:white;padding:8px 12px;border-radius:8px;font-size:11px;pointer-events:none;display:none;z-index:1000;max-width:185px;box-shadow:0 4px 16px rgba(0,0,0,.2);line-height:1.5;}
.tooltip strong{display:block;margin-bottom:2px;font-size:12px;color:var(--blue-light);}
.stbl{width:100%;border-collapse:collapse;font-size:11px;}
.stbl th{background:var(--navy);color:white;padding:6px 8px;text-align:left;font-size:10px;font-weight:700;}
.stbl td{padding:5px 8px;border-bottom:1px solid #edf0f5;color:var(--navy);}
.stbl tr:last-child td{border-bottom:none;}
.stbl tr:nth-child(even) td{background:var(--blue-pale);}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{background:white!important;}
  header .hacts,.sidebar,.tooltip{display:none!important;}
  .app-body{display:block!important;}
  .chart-area{padding:0!important;background:white!important;display:block!important;}
  .chart-card{border:none!important;border-radius:0!important;padding:0!important;}
  svg#curve{min-height:auto!important;height:62vh!important;}
  .legend{display:none!important;}
  @page{size:A4 landscape;margin:.8cm;}
}
</style>
</head>

const DEF_RANGES=[
  {label:'Lower Extreme',min:40,max:69,color:'#15264c'},
  {label:'Below Average',min:70,max:79,color:'#3ca5d5'},
  {label:'Low Average',min:80,max:89,color:'#b8e4f2'},
  {label:'Average',min:90,max:109,color:'#e8f6fb'},
  {label:'High Average',min:110,max:119,color:'#b8e4f2'},
  {label:'Above Average',min:120,max:129,color:'#3ca5d5'},
  {label:'Upper Extreme',min:130,max:160,color:'#15264c'},
];
let ranges=JSON.parse(JSON.stringify(DEF_RANGES));

function nPDF(x,m,s){return Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));}
function nCDF(z){
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const sg=z<0?-1:1,x=Math.abs(z)/Math.sqrt(2),t=1/(1+p*x);
  return 0.5*(1+sg*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x)));
}
function nsInv(p){
  const c=[0.3374754822726147,0.9761690190917186,0.1607979714918209,0.0276438810333863,0.0038405729373609,0.0003951896511349,0.0000321767881768,0.0000002888167364,0.0000003960315187];
  let r=p<0.5?p:1-p;r=Math.sqrt(-Math.log(r));
  let x=c[0];for(let i=1;i<9;i++)x=x*r+c[i];
  return p<0.5?-x:x;
}
function toSS(v,t){
  if(t==='ss')return +v;
  if(t==='scaled')return Math.round(((+v-10)/3)*15+100);
  if(t==='tscore')return Math.round(((+v-50)/10)*15+100);
  let p=+v;if(p<=0)p=0.1;if(p>=100)p=99.9;return Math.round(nsInv(p/100)*15+100);
}
function pct(ss){const z=(ss-100)/15,p=nCDF(z)*100;if(p<1)return'<1';if(p>99)return'>99';return Math.round(p)+'';}
function sc(ss){return Math.round(((ss-100)/15)*3+10);}
function tsc(ss){return Math.round(((ss-100)/15)*10+50);}
function tlbl(t){return{ss:'SS',scaled:'ScS',tscore:'T',percentile:'%ile'}[t];}

function addRow(label='',score='',type='ss'){
  if(scores.length>=15)return;
  scores.push({id:nextId++,label,score,type,color:COLORS[scores.length%COLORS.length]});
  renderScoreList();updateAll();
}
function removeRow(id){scores=scores.filter(s=>s.id!==id);renderScoreList();updateAll();}
function clearAll(){scores=[];nextId=0;renderScoreList();updateAll();}
function updateScore(id,field,val){const s=scores.find(s=>s.id===id);if(s){s[field]=val;updateAll();}}

function renderScoreList(){
  const list=document.getElementById('score-list');list.innerHTML='';
  scores.forEach(s=>{
    const r=document.createElement('div');r.className='srow';
    r.innerHTML=`<div class="lwrap"><span class="cdot" style="background:${s.color}"></span><input type="text" placeholder="Test name…" value="${s.label}" oninput="updateScore(${s.id},'label',this.value)" style="border:1.5px solid #dde3ec;border-radius:6px;padding:6px 7px;font-family:'DM Sans',sans-serif;font-size:12px;width:100%;color:var(--navy);"></div><input type="number" placeholder="Score" value="${s.score}" oninput="updateScore(${s.id},'score',this.value)" style="border:1.5px solid #dde3ec;border-radius:6px;padding:6px 5px;font-family:'DM Sans',sans-serif;font-size:12px;text-align:center;color:var(--navy);width:100%;"><select onchange="updateScore(${s.id},'type',this.value)" style="border:1.5px solid #dde3ec;border-radius:6px;padding:6px 4px;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--navy);width:100%;background:white;"><option value="ss" ${s.type==='ss'?'selected':''}>SS</option><option value="scaled" ${s.type==='scaled'?'selected':''}>ScS</option><option value="tscore" ${s.type==='tscore'?'selected':''}>T</option><option value="percentile" ${s.type==='percentile'?'selected':''}>%ile</option></select><button class="rbtn" onclick="removeRow(${s.id})">×</button>`;
    list.appendChild(r);
  });
  document.getElementById('add-btn').disabled=scores.length>=15;
}

function renderRanges(){
  const list=document.getElementById('range-list');list.innerHTML='';
  ranges.forEach((r,i)=>{
    const row=document.createElement('div');row.className='rgrid';
    row.innerHTML=`<div class="rlname"><span class="rswatch" style="background:${r.color}"></span><input type="text" value="${r.label}" oninput="updateRange(${i},'label',this.value)" style="border:1.5px solid #dde3ec;border-radius:5px;padding:5px 6px;font-family:'DM Sans',sans-serif;font-size:11px;width:100%;color:var(--navy);"></div><input type="number" value="${r.min}" oninput="updateRange(${i},'min',+this.value)" style="border:1.5px solid #dde3ec;border-radius:5px;padding:5px 4px;font-family:'DM Sans',sans-serif;font-size:11px;text-align:center;color:var(--navy);"><input type="number" value="${r.max}" oninput="updateRange(${i},'max',+this.value)" style="border:1.5px solid #dde3ec;border-radius:5px;padding:5px 4px;font-family:'DM Sans',sans-serif;font-size:11px;text-align:center;color:var(--navy);">`;
    list.appendChild(row);
  });
}
function updateRange(i,f,v){ranges[i][f]=v;drawCurve();}

const VW=820,VH=390,CL=58,CR=798,CT=28,CB=288;
const CW=CR-CL,CH=CB-CT,SS_MIN=40,SS_MAX=160,PEAK=nPDF(100,100,15);
function x(ss){return CL+((ss-SS_MIN)/(SS_MAX-SS_MIN))*CW;}
function y(pdf){return CB-(pdf/PEAK)*CH;}
function cpts(){const p=[];for(let ss=SS_MIN;ss<=SS_MAX;ss+=0.5)p.push([x(ss),y(nPDF(ss,100,15))]);return p;}
function poly(pts,base){let d=`${pts[0][0].toFixed(1)},${base}`;pts.forEach(p=>d+=` ${p[0].toFixed(1)},${p[1].toFixed(1)}`);return d+` ${pts[pts.length-1][0].toFixed(1)},${base}`;}
function el(t){return document.createElementNS('http://www.w3.org/2000/svg',t);}
function st(svg,px,py,str,color,size,weight,anchor='middle'){
  const t=el('text');t.setAttribute('x',px);t.setAttribute('y',py);t.setAttribute('text-anchor',anchor);
  t.setAttribute('font-family',"'DM Sans',sans-serif");t.setAttribute('font-size',size);
  t.setAttribute('font-weight',weight);t.setAttribute('fill',color);t.textContent=str;svg.appendChild(t);
}

function drawCurve(){
  const svg=document.getElementById('curve');svg.innerHTML='';
  const cp=cpts();

  ranges.forEach(r=>{
    const s1=Math.max(r.min,SS_MIN),s2=Math.min(r.max,SS_MAX);
    const pts=[];for(let ss=s1;ss<=s2;ss+=0.5)pts.push([x(ss),y(nPDF(ss,100,15))]);
    if(pts.length<2)return;
    const p=el('polygon');p.setAttribute('points',poly(pts,CB));p.setAttribute('fill',r.color);p.setAttribute('opacity','0.17');svg.appendChild(p);
  });

  const seen=new Set();
  ranges.forEach(r=>{
    [r.min,r.max].forEach(ss=>{
      if(ss===SS_MIN||ss===SS_MAX||seen.has(ss))return;seen.add(ss);
      const px=x(ss).toFixed(1),py=y(nPDF(ss,100,15)).toFixed(1);
      const ln=el('line');ln.setAttribute('x1',px);ln.setAttribute('x2',px);ln.setAttribute('y1',py);ln.setAttribute('y2',CB);
      ln.setAttribute('stroke','#15264c');ln.setAttribute('stroke-width','0.7');ln.setAttribute('stroke-dasharray','4 3');ln.setAttribute('opacity','0.28');svg.appendChild(ln);
    });
  });

  const mx=x(100).toFixed(1);
  const ml=el('line');ml.setAttribute('x1',mx);ml.setAttribute('x2',mx);ml.setAttribute('y1',y(PEAK).toFixed(1));ml.setAttribute('y2',CB);
  ml.setAttribute('stroke','#15264c');ml.setAttribute('stroke-width','1.2');ml.setAttribute('opacity','0.32');svg.appendChild(ml);

  const bl=el('line');bl.setAttribute('x1',CL);bl.setAttribute('x2',CR);bl.setAttribute('y1',CB);bl.setAttribute('y2',CB);
  bl.setAttribute('stroke','#15264c');bl.setAttribute('stroke-width','1.5');bl.setAttribute('opacity','0.22');svg.appendChild(bl);

  const path=el('path');path.setAttribute('d',cp.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '));
  path.setAttribute('fill','none');path.setAttribute('stroke','#15264c');path.setAttribute('stroke-width','2.5');svg.appendChild(path);

  ranges.forEach(r=>{
    const s1=Math.max(r.min,SS_MIN),s2=Math.min(r.max,SS_MAX);
    st(svg,x((s1+s2)/2).toFixed(1),(CB+12).toFixed(1),r.label,'#15264c',8,700);
  });

  const keys=[40,55,70,85,100,115,130,145,160];
  keys.forEach(ss=>{
    const px=x(ss).toFixed(1),y0=CB+25;
    st(svg,px,y0,ss+'','#15264c',9.5,700);
    const s=sc(ss);if(s>=1&&s<=19)st(svg,px,y0+13,s+'','#3ca5d5',8.5,400);
    const t=tsc(ss);if(t>=20&&t<=80)st(svg,px,y0+24,t+'','#3ca5d5',8.5,400);
    st(svg,px,y0+35,pct(ss),'#707070',8.5,400);
  });
  [{l:'SS',py:CB+25,c:'#15264c',w:700},{l:'ScS',py:CB+38,c:'#3ca5d5',w:400},{l:'T',py:CB+49,c:'#3ca5d5',w:400},{l:'%ile',py:CB+60,c:'#707070',w:400}]
    .forEach(r=>st(svg,(CL-5).toFixed(1),r.py.toFixed(1),r.l,r.c,8.5,r.w,'end'));

  scores.filter(s=>s.score!==''&&!isNaN(+s.score)).forEach((s,idx)=>{
    const ss=toSS(+s.score,s.type);if(ss<SS_MIN||ss>SS_MAX)return;
    const px=x(ss),py=y(nPDF(ss,100,15));
    const ln=el('line');ln.setAttribute('x1',px.toFixed(1));ln.setAttribute('x2',px.toFixed(1));ln.setAttribute('y1',py.toFixed(1));ln.setAttribute('y2',CB);
    ln.setAttribute('stroke',s.color);ln.setAttribute('stroke-width','1');ln.setAttribute('stroke-dasharray','3 2');ln.setAttribute('opacity','0.5');svg.appendChild(ln);
    const c=el('circle');c.setAttribute('cx',px.toFixed(1));c.setAttribute('cy',py.toFixed(1));c.setAttribute('r','7');
    c.setAttribute('fill',s.color);c.setAttribute('stroke','white');c.setAttribute('stroke-width','2');c.style.cursor='pointer';
    c.addEventListener('mouseenter',e=>showTip(e,s));c.addEventListener('mousemove',moveTip);c.addEventListener('mouseleave',hideTip);
    svg.appendChild(c);
    const lbl=el('text');lbl.setAttribute('x',px.toFixed(1));lbl.setAttribute('y',(py-14).toFixed(1));
    lbl.setAttribute('text-anchor','middle');lbl.setAttribute('font-family',"'DM Sans',sans-serif");
    lbl.setAttribute('font-size','9.5');lbl.setAttribute('font-weight','700');lbl.setAttribute('fill',s.color);
    lbl.textContent=s.label||`Score ${idx+1}`;svg.appendChild(lbl);
  });

}

function showTip(e,s){
  const ss=toSS(+s.score,s.type);
  document.getElementById('tooltip').innerHTML=`<strong>${s.label||'Score'}</strong>${tlbl(s.type)}: ${s.score}<br>SS: ${ss} &nbsp; Scaled: ${sc(ss)} &nbsp; T: ${tsc(ss)}<br>Percentile: ${pct(ss)}th`;
  document.getElementById('tooltip').style.display='block';moveTip(e);
}
function moveTip(e){const t=document.getElementById('tooltip');t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY-10)+'px';}
function hideTip(){document.getElementById('tooltip').style.display='none';}

function updateLegend(){
  const lg=document.getElementById('legend');lg.innerHTML='';
  scores.filter(s=>s.score!==''&&!isNaN(+s.score)).forEach(s=>{
    const ss=toSS(+s.score,s.type),item=document.createElement('div');item.className='li';
    item.innerHTML=`<span class="cdot" style="background:${s.color}"></span><span><strong>${s.label||'Score'}</strong> — ${tlbl(s.type)} ${s.score} (SS ${ss}, ${pct(ss)}th %ile)</span>`;
    lg.appendChild(item);
  });
}
function updateSummary(){
  const tbody=document.getElementById('summary-body'),sec=document.getElementById('summary-section');
  const valid=scores.filter(s=>s.score!==''&&!isNaN(+s.score));
  if(!valid.length){sec.style.display='none';return;}
  sec.style.display='block';tbody.innerHTML='';
  valid.forEach(s=>{
    const ss=toSS(+s.score,s.type),tr=document.createElement('tr');
    tr.innerHTML=`<td><span class="cdot" style="background:${s.color};display:inline-block;margin-right:4px;"></span>${s.label||'—'}</td><td>${s.score}</td><td>${tlbl(s.type)}</td><td>${ss}</td><td>${pct(ss)}</td>`;
    tbody.appendChild(tr);
  });
}

// PNG export
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function saveImage(){
  const svgEl=document.getElementById('curve');
  const EW=1800,HH=80,CH=760,EH=HH+CH;
  const canvas=document.createElement('canvas');canvas.width=EW;canvas.height=EH;
  const ctx=canvas.getContext('2d');

  // Navy header
  ctx.fillStyle='#15264c';ctx.fillRect(0,0,EW,HH);

  // Load white logo for header
  const wtImg=new Image();
  wtImg.onload=function(){
    // White logo in header
    const lh=52,lw=Math.round(lh*(wtImg.naturalWidth/wtImg.naturalHeight));
    ctx.drawImage(wtImg,20,(HH-lh)/2,lw,lh);

    // Divider in header
    ctx.strokeStyle='rgba(184,228,242,0.35)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(lw+36,14);ctx.lineTo(lw+36,HH-14);ctx.stroke();

    // Header text
    ctx.fillStyle='white';ctx.font='700 28px "DM Sans",sans-serif';
    ctx.fillText('Score Visualizer',lw+50,38);
    ctx.fillStyle='#b8e4f2';ctx.font='400 16px "DM Sans",sans-serif';
    ctx.fillText('Normal Distribution Reference  |  www.bcasp.ca',lw+50,62);

    // White curve area
    ctx.fillStyle='white';ctx.fillRect(0,HH,EW,CH);

    // Render SVG curve
    const clone=svgEl.cloneNode(true);
    clone.setAttribute('width',EW);clone.setAttribute('height',CH);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const svgData=new XMLSerializer().serializeToString(clone);
    const svgBlob=new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
    const svgUrl=URL.createObjectURL(svgBlob);
    const svgImg=new Image();
    svgImg.onload=function(){
      ctx.drawImage(svgImg,0,HH,EW,CH);

      URL.revokeObjectURL(svgUrl);
      const link=document.createElement('a');link.download='bcasp-score-visualizer.png';
      link.href=canvas.toDataURL('image/png');link.click();
    };
    svgImg.onerror=function(){
      URL.revokeObjectURL(svgUrl);
      const link=document.createElement('a');link.download='bcasp-score-visualizer.png';
      link.href=canvas.toDataURL('image/png');link.click();
    };
    svgImg.src=svgUrl;
  };
  wtImg.src=WT_SRC;
}

function updateAll(){drawCurve();updateLegend();updateSummary();}

renderRanges();
addRow('Working Memory',85,'ss');
addRow('Processing Speed',7,'scaled');
addRow('Attention (BRIEF-2)',65,'tscore');
</script>
